:root {
  --navy: #1d2554;
  --navy-2: #252e66;
  --ink: #151a3b;
  --gold: #f7a600;
  --gold-l: #fccd8e;
  --sky: #91bde1;
  --sky-l: #bdd7ed;
  --paper: #fbf6ea;
  --paper-2: #f1e8d4;
  --coral: #ef4230;
  --teal: #3bc3ad;
  --green: #6bbf3a;
  --line: rgba(29, 37, 84, 0.14);
  --u: clamp(12px, 0.9vw, 20px);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1a120c; overflow: hidden; }
body { font-family: Bitter, Georgia, serif; color: var(--ink); font-size: var(--u); -webkit-font-smoothing: antialiased; user-select: none; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; }

#app { position: fixed; inset: 0; }
#app.pre .topbar, #app.pre .teams, #app.pre .legend { opacity: 0; pointer-events: none; }
.topbar, .teams { transition: opacity .8s; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(10, 6, 3, 0.55) 100%); }

/* ---------- top bar ---------- */
.topbar { position: absolute; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; padding: calc(var(--u) * 1.1) calc(var(--u) * 1.4); pointer-events: none; }
.brand { pointer-events: auto; display: flex; gap: calc(var(--u) * 0.8); align-items: center; }
.brand-mark { width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.2); border-radius: 10px; background: var(--navy); color: var(--gold); display: grid; place-items: center; font-weight: 900; font-size: calc(var(--u) * 1.25); letter-spacing: -0.02em; border: 2px solid var(--gold); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.brand-eyebrow { color: var(--gold-l); font-weight: 700; font-size: calc(var(--u) * 0.72); letter-spacing: 0.14em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.brand-title { color: #fff; font-weight: 900; font-size: calc(var(--u) * 1.65); line-height: 1.05; letter-spacing: -0.01em; text-shadow: 0 2px 12px rgba(0,0,0,.55); }

.turn { pointer-events: auto; justify-self: center; display: flex; align-items: center; gap: calc(var(--u) * 0.8); background: var(--paper); border-radius: 999px; padding: calc(var(--u) * 0.45) calc(var(--u) * 1.3) calc(var(--u) * 0.45) calc(var(--u) * 0.5); box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 2px var(--gold); transition: transform .5s var(--ease-out), opacity .3s; }
.turn.hidden { opacity: 0; transform: translateY(-20px); }
.turn-chip { width: calc(var(--u) * 3.6); height: calc(var(--u) * 2.4); border-radius: 999px; display: grid; place-items: center; background: #fff; box-shadow: inset 0 0 0 3px var(--team); }
.turn-chip .veh { width: 80%; }
.turn-label { font-size: calc(var(--u) * 0.72); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #6b6f86; }
.turn-name { font-size: calc(var(--u) * 1.45); font-weight: 900; color: var(--navy); line-height: 1; }
.turn-hint { margin-left: calc(var(--u) * 0.6); padding-left: calc(var(--u) * 1); border-left: 1px solid var(--line); font-size: calc(var(--u) * 0.85); color: #50557a; }
kbd { font-family: inherit; font-weight: 700; font-size: .85em; background: var(--navy); color: var(--gold-l); padding: .1em .5em; border-radius: 5px; }

.tools { pointer-events: auto; justify-self: end; display: flex; gap: calc(var(--u) * 0.5); }
.tool { width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); border-radius: 12px; border: 0; background: rgba(21, 26, 59, 0.82); color: var(--paper); display: grid; place-items: center; transition: background .2s, transform .2s var(--ease); }
.tool:hover { background: var(--navy-2); transform: translateY(-1px); }
.tool.on { color: var(--gold); }
.ico { width: 52%; height: 52%; }

/* ---------- legend ---------- */
